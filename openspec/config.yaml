schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
context: |
  Tech stack: Nestjs, TypeScript, Node.js, postgres database

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
rules:
  design:
    - Before writing design.md, read docs/architecture/index.md and follow its guidelines.
    - Scan every architecture document linked from docs/architecture/index.md (relative markdown links) and apply those conventions in the design.
    - Call out any intentional deviation from architecture guidelines in Decisions or Risks / Trade-offs.
  proposal:
    - Always prefix the change folder name with "gh<number>-" using the Github ticket ID (e.g. gh16-feature-name). The openspec CLI requires names to start with a letter, so never use a bare number prefix.
    - If the ticket id is not available, ask for the ticket id from the user.
    - If the CLI rejects the change name for any reason, stop and surface the error to the user rather than silently dropping the ticket prefix.
